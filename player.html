<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    width: 100%;
    box-sizing: border-box;
  }

  .player-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 0;
    width: 100%; /* Spans full container width */
    box-sizing: border-box;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .play-btn {
    background: #62B6F3;
    border: none;
    color: #000000;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mute-btn {
    background: #62B6F3;
    border: none;
    color: #000000;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .progress-container {
    flex: 1; /* Drives the bar to fill all remaining horizontal space */
    height: 8px;
    background: #D9D9D6;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: #B1B3B3;
    border-radius: 4px;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    /* 52px (play) + 36px (mute) + 24px (2 gaps) = 112px offset to align under progress bar */
    margin-left: 112px; 
    color: #75787B;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="player-box">
    <div class="controls">
      <button class="play-btn" id="playBtn">▶</button>
      <button class="mute-btn" id="muteBtn">🔊</button>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');

    const audio = document.getElementById('audio');
    if (src) audio.src = src;

    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');

    function formatTime(t) {
      if (isNaN(t)) return "0:00";
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '❚❚';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      muteBtn.textContent = audio.muted ? '🔇' : '🔊';
    });

    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = (pct || 0) + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
  </script>
</body>
</html>
